{% extends "base.html" %}{% block title %}Edit Question{% endblock %}{% block content %}<header class="page-head"><span class="eyebrow">QUESTION BANK</span><h1>Edit Question</h1><p>Update the question, its options, subject, or correct answer.</p></header><section class="panel admin-add"><form method="post" action="{{ url_for('admin_save_question') }}" class="admin-question-form"><input type="hidden" name="question_id" value="{{ q.id }}"><div class="form-two"><label>Subject<input name="category" value="{{ q.category }}" required></label><label>Topic<input name="topic" value="{{ q.topic }}" required></label></div><label>Question<textarea name="question" rows="3" required>{{ q.question }}</textarea></label><div class="form-two">{% for key in ['A','B','C','D'] %}<label>Option {{ key }}<input name="option_{{ key }}" value="{{ q.options[key] }}" required></label>{% endfor %}</div><label>Correct answer<select name="answer" required>{% for key in ['A','B','C','D'] %}<option value="{{ key }}" {% if q.answer == key %}selected{% endif %}>Option {{ key }}</option>{% endfor %}</select></label><div class="bank-actions"><button class="btn primary" type="submit">Save Changes</button><a class="btn secondary" href="{{ url_for('admin_question_bank') }}">Cancel</a></div></form></section>{% endblock %}
