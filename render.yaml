
services:
  - type: web
    name: student-skill-gap-analyzer
    runtime: python
    plan: starter

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATA_DIR
        value: /var/data

      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: SKILLPATH_ADMIN_EMAIL
        sync: false

      - key: SKILLPATH_ADMIN_PASSWORD
        sync: false

    disk:
      name: skillpath-database
      mountPath: /var/data
      sizeGB: 1
